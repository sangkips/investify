apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-app
  namespace: laravel-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-app
  template:
    metadata:
      labels:
        app: laravel-app
    spec:
      containers:
      - name: laravel-app
        image: sangkips/laravel-app:latest
        ports:
        - containerPort: 9000
        env:
        # Use the exact connection string that worked
        - name: DATABASE_URL
          value: "postgresql://neondb_owner:npg_Xpf1Zo0UCaTV@ep-crimson-resonance-a9keyu4y-pooler.gwc.azure.neon.tech:5432/neondb?sslmode=require&channel_binding=require"
        # Keep other app variables
        - name: APP_NAME
          value: "Investify"
        - name: APP_ENV
          value: "production"
        - name: APP_KEY
          value: "base64:gjLt4pdO3U0wtUmTWLfQol5Ffns4uxG1ICn7yEkGtC4="
        - name: APP_DEBUG
          value: "false"
        - name: APP_URL
          value: "http://localhost"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5
