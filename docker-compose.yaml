version: "3"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: investify_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: investify-sangkipkoech-1e75.e.aivencloud.com
      DB_PORT: 12154
      DB_DATABASE: defaultdb
      DB_USERNAME: avnadmin
      DB_PASSWORD: AVNS_gWf-ZkTwSrYIk3vnFJG
    networks:
      - investify_net

  nginx:
    image: nginx:alpine
    container_name: investify_nginx
    restart: unless-stopped
    ports:
      - "800:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - investify_net

networks:
  investify_net:
    driver: bridge
