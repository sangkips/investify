version: '3'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: investify_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - investify_net

  nginx:
    image: nginx:alpine
    container_name: investify_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - investify_net

  db:
    image: mysql:8.0
    container_name: investify_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - investify_net

networks:
  investify_net:
    driver: bridge

volumes:
  dbdata:
    driver: local
