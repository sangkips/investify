name: Deploy to k3s

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set image tag
      id: tag
      run: |
        GIT_HASH=$(git rev-parse --short "$GITHUB_SHA")
        echo "tag=main-$GIT_HASH" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push PHP image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./docker/common/php-fpm/Dockerfile
        push: true
        tags: |
          sangkips/investify-php:${{ steps.tag.outputs.tag }}
          sangkips/investify-php:latest

    - name: Build and push Nginx image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./docker/production/nginx/Dockerfile
        push: true
        tags: |
          sangkips/investify-nginx:${{ steps.tag.outputs.tag }}
          sangkips/investify-nginx:latest

    - name: Deploy to k3s
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          # Pull latest images
          docker pull sangkips/investify-php:${{ steps.tag.outputs.tag }}
          docker pull sangkips/investify-nginx:${{ steps.tag.outputs.tag }}

          # Create namespace if not exists
          kubectl create namespace investify --dry-run=client -o yaml | kubectl apply -f -

          # Deploy using Helm
          helm upgrade --install investify ./helm/investify \
            --namespace investify \
            --set image.php.tag=${{ steps.tag.outputs.tag }} \
            --set image.nginx.tag=${{ steps.tag.outputs.tag }} \
            --atomic --timeout 5m
