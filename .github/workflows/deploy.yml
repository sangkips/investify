name: Build and Push Docker Images

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  REGISTRY: docker.io
  PHP_IMAGE: sangkips/investify-php
  NGINX_IMAGE: sangkips/investify-nginx

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set image tag
      id: tag
      run: |
        GIT_HASH=$(git rev-parse --short "$GITHUB_SHA")
        echo "tag=main-$GIT_HASH" >> $GITHUB_OUTPUT
        echo "📦 Image tag: main-$GIT_HASH"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push PHP image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./docker/common/php-fpm/Dockerfile
        push: true
        tags: |
          ${{ env.PHP_IMAGE }}:${{ steps.tag.outputs.tag }}
          ${{ env.PHP_IMAGE }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Nginx image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./docker/production/nginx/Dockerfile
        push: true
        tags: |
          ${{ env.NGINX_IMAGE }}:${{ steps.tag.outputs.tag }}
          ${{ env.NGINX_IMAGE }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Image summary
      run: |
        echo "## 🐳 Docker Images Published" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
        echo "| \`${{ env.PHP_IMAGE }}\` | \`${{ steps.tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| \`${{ env.NGINX_IMAGE }}\` | \`${{ steps.tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Both images are also tagged as \`latest\`" >> $GITHUB_STEP_SUMMARY
