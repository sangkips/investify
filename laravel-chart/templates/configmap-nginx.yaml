apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "laravel-chart.fullname" . }}-nginx-config
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /app/public;
        index index.php;

        location ~ \.php$ {
            fastcgi_pass localhost:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
    }