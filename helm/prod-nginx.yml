replicaCount: 1

image:
  repository: ektowett/investify-nginx
  pullPolicy: IfNotPresent
  tag: latest

serviceAccount:
  create: true

# livenessProbe:
#   exec:
#     command: ["php-fpm-healthcheck"]
#   initialDelaySeconds: 5
#   periodSeconds: 10
#   timeoutSeconds: 5
#   failureThreshold: 3

# readinessProbe:
#   exec:
#     command: ["php-fpm-healthcheck"]
#   initialDelaySeconds: 3
#   periodSeconds: 10
#   timeoutSeconds: 5
#   failureThreshold: 3

containerPort: 80

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-issuer
  hosts:
    - host: investify.citizix.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: investify-tls
      hosts:
        - investify.citizix.com

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 100m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 75

pdb:
  enabled: false
  minAvailable: 1

env:
  APP_NAME: Investify-Nginx
  APP_ENV: prod
