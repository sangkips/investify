{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgresql-service
  labels:
    {{- include "laravel-chart.labels" . | nindent 4 }}
    component: postgresql
spec:
  selector:
    app.kubernetes.io/name: {{ include "laravel-chart.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    component: postgresql
  ports:
  - port: 5432
    targetPort: 5432
{{- end }}