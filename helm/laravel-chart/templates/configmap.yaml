apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-laravel-env
  labels:
    {{- include "laravel-chart.labels" . | nindent 4 }}
data:
  .env: |
    APP_NAME=Investify
    APP_ENV=production
    APP_KEY=base64:gjLt4pdO3U0wtUmTWLfQol5Ffns4uxG1ICn7yEkGtC4=
    APP_DEBUG=false
    APP_URL=http://localhost
    
    LOG_CHANNEL=stack
    LOG_DEPRECATIONS_CHANNEL=null
    LOG_LEVEL=debug
    
    DB_CONNECTION=pgsql
    DB_HOST=laravel-chart-postgresql-service
    DB_PORT=5432
    DB_DATABASE={{ .Values.postgresql.database | default "vicinvest" }}
    DB_USERNAME={{ .Values.postgresql.username | default "laravel" }}
    DB_PASSWORD={{ .Values.postgresql.password | default "your-secure-password-here" }}
    
    BROADCAST_DRIVER=log
    CACHE_DRIVER=file
    FILESYSTEM_DISK=local
    QUEUE_CONNECTION=sync
    SESSION_DRIVER=file
    SESSION_LIFETIME=120
    
    MEMCACHED_HOST=127.0.0.1
    
    REDIS_HOST=127.0.0.1
    REDIS_PASSWORD=null
    REDIS_PORT=6379
    
    MAIL_MAILER=smtp
    MAIL_HOST=mailpit
    MAIL_PORT=1025
    MAIL_USERNAME=null
    MAIL_PASSWORD=null
    MAIL_ENCRYPTION=null
    MAIL_FROM_ADDRESS="hello@example.com"
    MAIL_FROM_NAME="{{ .Release.Name }}"