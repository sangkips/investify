apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-php
  labels:
    app: {{ .Chart.Name }}-php
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-php
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-php
    spec:
      containers:
      - name: php-fpm
        image: "{{ .Values.image.php.repository }}:{{ .Values.image.php.tag }}"
        ports:
        - containerPort: 9000
        env:
        - name: DB_CONNECTION
          value: "pgsql"
        - name: DB_HOST
          value: "laravel-chart-postgresql-service"
        - name: DB_PORT
          value: "5432"
        - name: DB_DATABASE
          value: "vicinvest"
        - name: DB_USERNAME
          value: "laravel"
        - name: DB_PASSWORD
          value: "fns4uxG1ICn7yEkGtC4="
        - name: APP_ENV
          value: "production"
        - name: APP_DEBUG
          value: "false"
        - name: APP_KEY
          value: "base64:gjLt4pdO3U0wtUmTWLfQol5Ffns4uxG1ICn7yEkGtC4="
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      volumes:
      - name: laravel-env
        configMap:
          name: {{ .Release.Name }}-laravel-env
      - name: laravel-storage
        emptyDir: {}
      - name: laravel-bootstrap
        emptyDir: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-nginx
  labels:
    app: {{ .Chart.Name }}-nginx
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-nginx
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-nginx
    spec:
      containers:
      - name: nginx
        image: "{{ .Values.image.nginx.repository }}:{{ .Values.image.nginx.tag }}"
        ports:
        - containerPort: 80
        resources:
          {{- toYaml .Values.resources | nindent 12 }}