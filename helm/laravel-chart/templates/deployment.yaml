apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-php
  labels:
    app: {{ .Chart.Name }}-php
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-php
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-php
    spec:
      containers:
      - name: php-fpm
        image: "{{ .Values.image.php.repository }}:{{ .Values.image.php.tag }}"
        ports:
        - containerPort: 9000
        command: ["/bin/sh"]
        args: 
          - -c
          - |
            # Clear any cached config and ensure fresh environment
            php artisan config:clear || true
            php artisan cache:clear || true
            # Wait for database to be ready
            until php artisan migrate:status > /dev/null 2>&1; do
              echo "Waiting for database connection..."
              sleep 5
            done
            # Run migrations
            php artisan migrate --force
            # Start PHP-FPM
            exec php-fpm
        volumeMounts:
        - name: laravel-env
          mountPath: /var/www/html/.env
          subPath: .env
        - name: laravel-storage
          mountPath: /var/www/html/storage
        - name: laravel-bootstrap
          mountPath: /var/www/html/bootstrap/cache
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      volumes:
      - name: laravel-env
        configMap:
          name: {{ .Release.Name }}-laravel-env
      - name: laravel-storage
        emptyDir: {}
      - name: laravel-bootstrap
        emptyDir: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-nginx
  labels:
    app: {{ .Chart.Name }}-nginx
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-nginx
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-nginx
    spec:
      containers:
      - name: nginx
        image: "{{ .Values.image.nginx.repository }}:{{ .Values.image.nginx.tag }}"
        ports:
        - containerPort: 80
        resources:
          {{- toYaml .Values.resources | nindent 12 }}