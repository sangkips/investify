apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-php
  labels:
    app: {{ .Chart.Name }}-php
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-php
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-php
    spec:
      containers:
      - name: php-fpm
        image: "{{ .Values.image.php.repository }}:{{ .Values.image.php.tag }}"

        volumeMounts:
      - name: laravel-env
        mountPath: /var/www/html/.env
        subPath: .env
      - name: laravel-storage
        mountPath: /var/www/html/storage
      - name: laravel-bootstrap
        mountPath: /var/www/html/bootstrap/cache

# Add volumes to the pod spec:
volumes:
- name: laravel-env
  configMap:
    name: {{ .Release.Name }}-laravel-env
- name: laravel-storage
  emptyDir: {}
- name: laravel-bootstrap
  emptyDir: {}
        ports:
        - containerPort: 9000
        resources:
          {{- toYaml .Values.resources | nindent 12 }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-nginx
  labels:
    app: {{ .Chart.Name }}-nginx
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-nginx
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-nginx
    spec:
      containers:
      - name: nginx
        image: "{{ .Values.image.nginx.repository }}:{{ .Values.image.nginx.tag }}"
        ports:
        - containerPort: 80
        resources:
          {{- toYaml .Values.resources | nindent 12 }}