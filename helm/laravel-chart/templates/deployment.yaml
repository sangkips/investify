apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-php
  labels:
    app: {{ .Chart.Name }}-php
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-php
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-php
    spec:
      initContainers:
      - name: wait-for-db
        image: postgres:15-alpine
        command: ['sh', '-c']
        args:
          - |
            until pg_isready -h {{ .Values.laravel.dbHost | default (printf "%s-postgresql-service" .Release.Name) }} -p {{ .Values.laravel.dbPort | default "5432" }} -U {{ .Values.postgresql.username | default "laravel" }}; do
              echo "Waiting for PostgreSQL..."
              sleep 2
            done
            echo "PostgreSQL is ready!"
        env:
        - name: PGPASSWORD
          value: {{ .Values.postgresql.password | default "your-secure-password-here" | quote }}
      containers:
      - name: php-fpm
        image: "{{ .Values.image.php.repository }}:{{ .Values.image.php.tag }}"
        ports:
        - containerPort: 9000
        command: ["/bin/sh"]
        args:
          - -c
          - |
            # Clear any cached config
            php artisan config:clear || true
            php artisan cache:clear || true
            # Run migrations
            php artisan migrate --force || true
            # Start PHP-FPM
            exec php-fpm
        volumeMounts:
        - name: laravel-env
          mountPath: /var/www/html/.env
          subPath: .env
        - name: laravel-storage
          mountPath: /var/www/html/storage
        - name: laravel-bootstrap
          mountPath: /var/www/html/bootstrap/cache
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      volumes:
      - name: laravel-env
        configMap:
          name: {{ .Release.Name }}-laravel-env
      - name: laravel-storage
        emptyDir: {}
      - name: laravel-bootstrap
        emptyDir: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-nginx
  labels:
    app: {{ .Chart.Name }}-nginx
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-nginx
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-nginx
    spec:
      containers:
      - name: nginx
        image: "{{ .Values.image.nginx.repository }}:{{ .Values.image.nginx.tag }}"
        ports:
        - containerPort: 80
        resources:
          {{- toYaml .Values.resources | nindent 12 }}