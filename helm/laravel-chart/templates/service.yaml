apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-php-service
spec:
  selector:
    app: {{ .Chart.Name }}-php
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-nginx-service
spec:
  selector:
    app: {{ .Chart.Name }}-nginx
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: 80