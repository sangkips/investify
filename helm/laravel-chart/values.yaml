replicaCount: 1

# PostgreSQL Configuration
postgresql:
  enabled: true
  database: "vicinvest"
  username: "laravel"
  password: "your-secure-password-here" # Change this!
  host: "" # Leave empty, will use service name

# Laravel Database Configuration
laravel:
  dbConnection: "pgsql"
  dbHost: "laravel-chart-postgresql-service" # This will be the service name
  dbPort: "5432"
  # dbDatabase, dbUsername, dbPassword will reference postgresql values

image:
  nginx:
    repository: sangkips/investify-nginx
    tag: latest
    pullPolicy: IfNotPresent
  php:
    repository: sangkips/investify-php
    tag: latest
    pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "traefik"
  hosts:
  - host: investify.autoscaleops.com
    paths:
    - path: /
      pathType: Prefix

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"
