replicaCount: 2

image:
  repository: sangkips/laravel-app
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
  - host: investify.autoscaleops.com
    paths:
    - path: /
      pathType: Prefix
  tls:
  - secretName: investify-tls
    hosts:
    - investify.autoscaleops.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables (non-sensitive)
env:
  APP_NAME: "Investify"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://investify.autoscaleops.com"
  LOG_CHANNEL: "stack"
  LOG_DEPRECATIONS_CHANNEL: "null"
  LOG_LEVEL: "info"
  DB_CONNECTION: "pgsql"
  DB_PORT: "5432"
  BROADCAST_DRIVER: "log"
  CACHE_DRIVER: "redis"
  FILESYSTEM_DISK: "local"
  QUEUE_CONNECTION: "redis"
  SESSION_DRIVER: "redis"
  SESSION_LIFETIME: "120"
  REDIS_PORT: "6379"
  MAIL_MAILER: "smtp"
  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
  MAIL_ENCRYPTION: "tls"
  MAIL_FROM_NAME: "Investify"

# Secret environment variables (from Vault/Kubernetes secrets)
secretEnv:
  APP_KEY:
    name: laravel-secrets
    key: app-key
  DB_HOST:
    name: laravel-secrets
    key: db-host
  DB_DATABASE:
    name: laravel-secrets
    key: db-database
  DB_USERNAME:
    name: laravel-secrets
    key: db-username
  DB_PASSWORD:
    name: laravel-secrets
    key: db-password
  REDIS_HOST:
    name: laravel-secrets
    key: redis-host
  REDIS_PASSWORD:
    name: laravel-secrets
    key: redis-password
  MAIL_USERNAME:
    name: laravel-secrets
    key: mail-username
  MAIL_PASSWORD:
    name: laravel-secrets
    key: mail-password
  MAIL_FROM_ADDRESS:
    name: laravel-secrets
    key: mail-from-address
