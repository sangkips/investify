replicaCount: 1

image:
  repository: ektowett/investify
  pullPolicy: IfNotPresent
  tag: latest

serviceAccount:
  create: true

livenessProbe:
  path: /healthz
  port: 7020
  initialDelaySeconds: 15
  periodSeconds: 15
  timeoutSeconds: 15

readinessProbe:
  path: /healthz
  port: 7020
  initialDelaySeconds: 15
  periodSeconds: 15
  timeoutSeconds: 15

containerPort: 7020

service:
  type: ClusterIP
  port: 7020

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-issuer
  hosts:
    - host: investify.citizix.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: investify-tls
      hosts:
        - investify.citizix.com

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 100m
    memory: 64Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 75

