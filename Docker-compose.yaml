version: '3'
services:
  db:
    image: mysql
    ports:
      - 3306:3306
    environment:
      MYSQL_DATABASE: 'vicinvest'
      MYSQL_USER: 'root'
      MYSQL_PASSWORD: 'zx0011'
      MYSQL_ROOT_PASSWORD: 'zx0011'
  web:
    build: .
    ports:
      - 3000:8080
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: vicinvest
      DB_USERNAME: root
      DB_PASSWORD: zx0011
    volumes:
      - .:/app
